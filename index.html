    :root {

    }

    body {

    :root {
      --export-primary: #00d4ff;
      --export-accent: #a855f7;
      --export-surface: rgba(255, 255, 255, 0.02);
      --export-border: rgba(255, 255, 255, 0.08);
    }

    html,

      padding: 0;
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      position: relative;
      overflow-x: hidden;

    }

    .export-bg-orb {
      position: fixed;
      width: 32rem;
      height: 32rem;
      border-radius: 9999px;

    }

    .export-bg-orb.a {
      top: -10rem;
      left: -10rem;
      background: var(--export-primary);
    }

    .export-bg-orb.b {
      right: -10rem;
      top: 22%;
      background: var(--export-accent);
      animation-delay: -6s;
    }

    .export-content {
      position: relative;
      z-index: 1;
    }

    .export-content section[data-custom-hero="true"] {
      min-height: 100vh;
    }

    .export-content section[data-custom-hero="true"]>div {
      min-height: calc(100vh - 10rem);
      width: 100%;
    }

    .export-content section[data-custom-hero="true"] p {
      display: block !important;
      -webkit-line-clamp: unset !important;
      -webkit-box-orient: initial !important;
      overflow: visible !important;
      text-overflow: unset !important;
      white-space: normal !important;
    }

    .export-content section[data-custom-hero="true"] .inline-flex {
      display: inline-flex !important;
      width: auto !important;
      max-width: max-content !important;
    }

    a,
    button {
      transition: transform 260ms cubic-bezier(0.22, 1, 0.36, 1), filter 260ms cubic-bezier(0.22, 1, 0.36, 1), opacity 200ms ease, box-shadow 260ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    a:hover,
    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .export-hero-title {
      background-image: linear-gradient(110deg,
          color-mix(in oklab, var(--export-primary) 70%, white) 0%,
          color-mix(in oklab, white 96%, transparent) 34%,
          color-mix(in oklab, var(--export-accent) 72%, white) 68%,
          color-mix(in oklab, var(--export-primary) 70%, white) 100%);
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: exportFadeInUp 980ms cubic-bezier(0.22, 1, 0.36, 1) both, exportTextShimmer 6.4s linear infinite;
      letter-spacing: -0.03em;
      text-wrap: balance;
    }

    .export-section-title {
      position: relative;
      text-wrap: balance;
    }

    .export-section-title::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -12px;
      width: 68px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--export-primary), var(--export-accent));
      transform: scaleX(0);
      transform-origin: left;
      animation: exportLineIn 900ms cubic-bezier(0.22, 1, 0.36, 1) 320ms forwards;
    }

    .export-section-title.export-section-title--center::after {
      left: 50%;
      transform: translateX(-50%) scaleX(0);
      transform-origin: center;
    }

    .export-card {
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .export-card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      background: linear-gradient(120deg,
          transparent 0%,
          color-mix(in oklab, var(--export-primary) 20%, transparent) 30%,
          color-mix(in oklab, var(--export-accent) 24%, transparent) 55%,
          transparent 88%);
      opacity: 0;
      transform: translateX(-18%) rotate(2deg);
      transition: opacity 360ms ease, transform 700ms cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
      z-index: 0;
    }

    .export-card:hover::before {
      opacity: 0.85;
      transform: translateX(6%) rotate(2deg);
    }

    .export-card:hover {
      transform: translateY(-8px) scale(1.012);
      box-shadow: 0 30px 64px -28px rgba(0, 0, 0, 0.55);
    }

    [data-export-project-modal="true"] [data-export-modal-body] {
      display: flex;
      flex-direction: column;
    }

    [data-export-project-modal="true"] [data-export-modal-actions] {
      position: static !important;
      margin-top: auto;
    }

    /* Light compatibility for shared section renderers in exported HTML */
    .sr-theme-light {
      --sr-surface-soft: #f8fafc;
      --sr-border: rgba(148, 163, 184, 0.36);
      --sr-text: #0f172a;

    .sr-theme-light [class*="border-black"],
    .sr-theme-light [class*="border-neutral-"],

    }

    /* Premium project overlays (export parity with app mode) */
    .projects-premium [data-project-id] {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      will-change: transform;
    }

    .projects-premium [data-project-id]::before {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      top: 0;
      height: 1px;
      opacity: 0.65;
      background: linear-gradient(90deg,
          transparent 0%,
          color-mix(in oklab, var(--export-primary) 48%, white) 28%,
          color-mix(in oklab, var(--export-accent) 42%, white) 68%,
          transparent 100%);
      z-index: 1;
      pointer-events: none;
    }

    .projects-premium [data-project-id]::after {
      display: none;
    }

    .projects-premium--dense [data-project-id] {
      transition-duration: 180ms !important;
    }

    .projects-premium--dense [data-project-id]:hover {
      transform: translateY(-2px) !important;
    }

    .export-content section,
    .export-content article {
      transform-origin: center;
    }

    .export-tech-marquee-lane {
      display: flex;
      gap: 0.75rem;
      white-space: nowrap;
      width: max-content;
      min-width: 200%;
      animation: exportTechMarqueeLeft 18s linear infinite;
    }

    .export-tech-marquee-lane--reverse {
      animation-name: exportTechMarqueeRight;
      animation-duration: 22s;
    }

    @media (prefers-reduced-motion: reduce) {

      .export-tech-marquee-lane,
      .export-tech-marquee-lane--reverse {
        animation: none !important;
        min-width: 100%;
        flex-wrap: wrap;
        white-space: normal;
      }
    }

    .export-card,
    .project-card,
    .experience-item,
    .education-item {
      transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 320ms cubic-bezier(0.22, 1, 0.36, 1), border-color 320ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .export-reveal {
      opacity: 0;
      transform: translate3d(0, var(--reveal-distance, 18px), 0);
      transition:
        opacity var(--reveal-duration, 620ms) var(--reveal-easing, cubic-bezier(0.22, 1, 0.36, 1)),
        transform var(--reveal-duration, 620ms) var(--reveal-easing, cubic-bezier(0.22, 1, 0.36, 1));
      transition-delay: var(--reveal-delay, 0ms);
      will-change: transform, opacity;
    }

    .export-reveal.is-visible {
      opacity: 1;
      transform: translate3d(0, 0, 0);
      will-change: auto;
    }

    @keyframes exportFloat {

      0%,
      100% {
        transform: translate3d(0, 0, 0) scale(1);
      }

      50% {
        transform: translate3d(0, -36px, 0) scale(1.11);
      }
    }

    @keyframes exportTextShimmer {
      0% {
        background-position: 0% 50%;
      }

      100% {
        background-position: 220% 50%;
      }
    }

    @keyframes exportLineIn {
      to {
        transform: scaleX(1);
      }
    }

    @keyframes exportFadeInUp {
      from {
        opacity: 0;
        transform: translate3d(0, 18px, 0);
      }

      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes exportTechMarqueeLeft {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    @keyframes exportTechMarqueeRight {
      from {
        transform: translateX(-50%);
      }

      to {
        transform: translateX(0);
      }
    }
  </style>
</head>
